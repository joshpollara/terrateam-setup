version: '3.8'

services:
  terrateam-setup:
    build: .
    image: terrateam-setup:latest
    container_name: terrateam-setup
    network_mode: "host"
    volumes:
      # Mount current directory to /output so .env is written to host
      - ./:/output:Z
    working_dir: /output
    # Override entrypoint to run with output in mounted directory
    entrypoint: ["/app/terrateam-setup"]
    # Example command - override this when running
    command: ["--help"]
    environment:
      # These can be overridden via .env file or command line
      - PORT=3000
